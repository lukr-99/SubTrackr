name: Release

# A v* tag builds the desktop installer and the signed APK, each with a SHA-256 file, and drafts a
# GitHub Release with all four. Publish the draft by hand after the checks in docs/releasing.md;
# until then neither app's update check can see it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches Version.props and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -n 's:.*<SubTrackrVersion>\([0-9]*\.[0-9]*\.[0-9]*\)</SubTrackrVersion>.*:\1:p' Version.props)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match Version.props ($version)."; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version."; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test SubTrackr.slnx -c Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer and checksum
        shell: pwsh
        run: ./installer/build-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: installer/dist/
          if-no-files-found: error

  android:
    name: Signed Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Fail closed: never publish an unsigned APK just because a tag was pushed.
      - name: Signing secrets are present
        env:
          SUBTRACKR_KEYSTORE_BASE64: ${{ secrets.SUBTRACKR_KEYSTORE_BASE64 }}
          SUBTRACKR_KEYSTORE_PASSWORD: ${{ secrets.SUBTRACKR_KEYSTORE_PASSWORD }}
          SUBTRACKR_KEY_ALIAS: ${{ secrets.SUBTRACKR_KEY_ALIAS }}
          SUBTRACKR_KEY_PASSWORD: ${{ secrets.SUBTRACKR_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SUBTRACKR_KEYSTORE_BASE64 SUBTRACKR_KEYSTORE_PASSWORD SUBTRACKR_KEY_ALIAS SUBTRACKR_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to build an unsigned release. Run tools/setup-android-signing.ps1 -UploadSecrets."
            exit 1
          fi

      - name: Write the signing configuration
        env:
          SUBTRACKR_KEYSTORE_BASE64: ${{ secrets.SUBTRACKR_KEYSTORE_BASE64 }}
          SUBTRACKR_KEYSTORE_PASSWORD: ${{ secrets.SUBTRACKR_KEYSTORE_PASSWORD }}
          SUBTRACKR_KEY_ALIAS: ${{ secrets.SUBTRACKR_KEY_ALIAS }}
          SUBTRACKR_KEY_PASSWORD: ${{ secrets.SUBTRACKR_KEY_PASSWORD }}
        run: |
          printf '%s' "$SUBTRACKR_KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SUBTRACKR_KEYSTORE_PASSWORD" "$SUBTRACKR_KEY_ALIAS" "$SUBTRACKR_KEY_PASSWORD" > keystore.properties

      - name: Test and build the signed APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Check the signing certificate and write the checksum
        run: |
          version='${{ needs.version.outputs.value }}'
          apk="dist/SubTrackr-$version.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(tr -d '[:space:]' < release-signing-cert.sha256)
          if [ "$actual" != "$expected" ]; then
            echo "The APK is signed by $actual, expected $expected (android/release-signing-cert.sha256)."
            exit 1
          fi
          (cd dist && sha256sum "SubTrackr-$version.apk" > "SubTrackr-$version.apk.sha256")

      - name: Remove the signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/dist/
          if-no-files-found: error

  publish:
    name: Draft the GitHub Release
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.version.outputs.value }}'
          python3 tools/release_notes.py "$version" > notes.md
          (cd artifacts && sha256sum -c ./*.sha256)
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag --draft --title "SubTrackr $version" --notes-file notes.md
